conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 2,
    cpu_avg_samples = 1,
    default_color = 'green',
    default_outline_color = 'green',
    default_shade_color = 'green',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=9',
    gap_x = 8,
    gap_y = 8,
    minimum_height = 0,
    minimum_width = 0,
    net_avg_samples = 1,
    no_buffers = false,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0, 
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[

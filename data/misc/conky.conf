${color white}BATTERY: ${color green}${execpi 1 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep 'energy:' | awk '{print $2}'} Wh ${color white}/${color green} ${execpi 30 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep 'energy-full:' | awk '{print $2}'} Wh - ${color green}${execpi 5 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep 'percentage:' | awk '{print $2}'} ${alignr}${color white}CHARGE CYCLES: ${color green}${execpi 1 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep 'charge-cycles:' | awk '{print $2}'}
